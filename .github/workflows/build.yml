# Builds Gore Sandbox for Windows in the cloud (no Unity install needed on your PC).
# Run it from the "Actions" tab → "Build Gore Sandbox" → "Run workflow", or just push to main.
# Needs 3 repository secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD  (see BUILD_ON_GITHUB.md).
name: Build Gore Sandbox

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Needed to publish releases (that's what the in-game auto-updater downloads).
permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x64) build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (Unity images are large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Check out project
        uses: actions/checkout@v4

      - name: Check secrets are set
        id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            # No Unity license here: skip the cloud build. Build in Unity yourself and upload the zip to a GitHub
            # release instead (see BUILD_ON_GITHUB.md) - players' games still auto-update from it.
            echo "::notice::Cloud build skipped (missing secrets:$missing). Build in Unity and upload GoreSandbox-Windows.zip to a release named v<version>."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Unity Library folder
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Tell the auto-updater where updates come from
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p Assets/Resources
          echo "${{ github.repository }}" > Assets/Resources/update_repo.txt

      - name: Build with Unity
        if: steps.secrets.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: GoreSandbox
          buildMethod: SolarEclipse.EditorTools.CIBuild.Build
          versioning: None

      - name: Upload the game
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GoreSandbox-Windows
          path: build/StandaloneWindows64
          retention-days: 30

      - name: Zip the game
        if: steps.secrets.outputs.ok == 'true'
        id: pack
        run: |
          version=$(grep -oP 'Version = "\K[^"]+' Assets/SolarEclipse/Scripts/Core/GameInfo.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sudo chown -R "$(id -u)" build || true
          (cd build/StandaloneWindows64 && zip -qr "$GITHUB_WORKSPACE/GoreSandbox-Windows.zip" .)
          # Release notes = the newest entry of the in-game changelog, without the formatting tags.
          python3 - <<'PY'
          import re
          src = open("Assets/SolarEclipse/Scripts/UI/Screens/ChangelogScreen.cs", encoding="utf-8").read()
          text = src.split('@"', 1)[1]
          parts = text.split("<b><size=30>")
          newest = parts[1] if len(parts) > 1 else text
          newest = re.sub(r"<[^>]+>", "", newest).strip()
          open("release_notes.txt", "w", encoding="utf-8").write(newest + "\n")
          PY

      - name: Publish the update (players get it automatically)
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.pack.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists: replacing its download with this build."
            echo "Players only auto-update when GameInfo.Version goes up, so bump it for every new update."
            gh release upload "$tag" GoreSandbox-Windows.zip --clobber
          else
            gh release create "$tag" GoreSandbox-Windows.zip --title "Gore Sandbox $tag" --notes-file release_notes.txt --latest
          fi
